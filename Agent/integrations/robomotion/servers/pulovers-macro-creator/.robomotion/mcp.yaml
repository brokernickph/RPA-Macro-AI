type: mcp
name: pulovers-macro-creator
title: RPA Macro AI (browser + desktop, Pulover's Macro Creator)
author: RPA-Macro-AI contributors
version: 0.1.0
license: GPL-3.0-or-later
category: Productivity
summary: Browser and Windows desktop automation built on Pulover's Macro Creator.
  Drive web pages (Edge/Chrome via Playwright), build and run flows that mix browser,
  desktop and recorded PMC macros with variables, loops and branches, record human
  demonstrations, and observe or drive the desktop (screenshots, windows, mouse,
  keyboard, image search). Runs as a stdio subprocess on the Windows host; no
  credential is required.
source_url: https://github.com/brokernickph/rpa-macro-ai
tags: [rpa, browser, desktop, windows, playwright, autohotkey, macro, recorder, automation, stdio]
transport: stdio
command: uvx
args: ["--from", "git+https://github.com/brokernickph/rpa-macro-ai@feature/ai-agent-rpa-mcp#subdirectory=Agent", "pmc-mcp"]
timeout: 600
# Drives the desktop it runs on and reads/writes files in PMC_MCP_ROOTS. Browser
# egress depends on the sites the user's flows visit, so no fixed allowlist ships.
egress_hosts: []
